server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cuerpos grandes por si se sirve la ingesta a través del mismo host.
    client_max_body_size 20m;

    # La API vive en el mismo dominio: se reenvía al contenedor `api`.
    # Así el frontend usa rutas relativas y no hace falta un dominio aparte.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta desconocida cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
